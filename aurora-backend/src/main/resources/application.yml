spring:
  application:
    name: aurora-bookstore
  docker:
    compose:
      file: ../docker-compose.yml
  # mysql config
  datasource:
    url: jdbc:mysql://localhost:3307/aurora_db?allowPublicKeyRetrieval=true&useSSL=false
        # conection protocol/Mysql address and port/database name/safety parameters
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver #java class used for sql translation

  # jpa/hibernate config
  jpa:
    hibernate:
      ddl-auto: validate # hibernate see if the tables are exactly the model entities
    show-sql: true # show sql in the terminal
    properties:
      hibernate:
        "[format_sql]": true

  # Ai config
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.1
        temperature: 0.0
      embedding:
        model: nomic-embed-text
    vectorstore:
      chroma:
        initialize-schema: true
        client:
          host: http://localhost
          port: 8000
  # mail config (optional in dev; falls back to console logging when MAIL_HOST/MAIL_USERNAME are unset)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

api:
  security:
    token:
      secret: ${JWT_SECRET:conformidade}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  app:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:noreply@aurorabookstore.local}

logging:
  level:
    "[org.springframework]": INFO
    "[com.github.gr.aurora_bookstore]": DEBUG